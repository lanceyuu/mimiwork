<script type="application/json" id="mimi-app">{"mimiwork_app": 1, "title": "Survey question previewer", "icon": "📋", "category": "Research", "description": "Paste draft survey questions; see them as a respondent would, with a plain-language critique and a better wording for each.", "intro": "Paste your questions, one per line, then press Review.", "suggestions": ["Check these for leading wording", "Is this scale balanced?", "Simplify for non-native speakers"]}</script>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Survey question previewer</title>
<style>
  :root { --accent: #0d9488; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --paper: #f9fafb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 780px; margin: 0 auto; padding: 24px 20px 40px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
  textarea, input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); font-weight: 500; padding: 8px 6px; }
  .out { white-space: pre-wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); min-height: 60px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--paper); min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 16px; cursor: pointer; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #e6f4f2; color: var(--accent); font-size: 12px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Survey question previewer</h1>
  <p class="lead">Paste your questions, one per line, then press Review.</p>
  <textarea id="src" placeholder="One question per line. Add answer options after a colon, e.g. How satisfied are you?: Very / Somewhat / Not at all"></textarea>
  <div class="row"><input id="lens" type="text" style="flex:1;min-width:200px" placeholder="Look especially for… (optional)"><button id="go">Review</button><span id="status" class="muted"></span></div>
  <div id="out"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function setStatus(t) { $("status").textContent = t || ""; }
  function copyText(t) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); setStatus("Copied."); } catch {} ta.remove(); }
  async function run(btn, fn) { btn.disabled = true; setStatus("Asking Mimi…"); try { await fn(); setStatus(""); } catch (e) { setStatus("Could not do that: " + (e.message || e)); } finally { btn.disabled = false; } }

  $("go").onclick = () => run($("go"), async () => {
    const src = $("src").value.trim(); if (!src) return; const lens = $("lens").value.trim();
    const items = await Mimi.ask("Review these survey questions as a survey methodologist" + (lens ? ", looking especially for " + lens : "") + ". For each, reply with JSON only: an array of objects with keys question (as given), issue (one sentence, or 'none'), better (a rewritten question, or the same if fine), options (array of answer options to show, may be empty).\n\n" + src, { json: true });
    if (!Array.isArray(items)) throw new Error("no review came back");
    $("out").innerHTML = items.map((it, n) => "<div style='border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0'><div class='muted'>Q" + (n + 1) + "</div><div style='font-weight:600;margin:2px 0 6px'>" + esc(it.better || it.question) + "</div>" + (Array.isArray(it.options) && it.options.length ? "<div style='display:flex;flex-direction:column;gap:4px;margin-bottom:8px'>" + it.options.map((o) => "<label><input type='radio' disabled> " + esc(o) + "</label>").join("") + "</div>" : "") + (it.issue && it.issue !== "none" ? "<div class='muted'>Was: “" + esc(it.question) + "” — " + esc(it.issue) + "</div>" : "<div class='muted'>Reads well as is.</div>") + "</div>").join("");
  });
  function esc(s) { return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  Mimi.onSuggestion((text) => { $("lens").value = text.replace(/^(check these for|is this|simplify for)\s*/i, ""); $("src").focus(); });
</script>
</body>
</html>
