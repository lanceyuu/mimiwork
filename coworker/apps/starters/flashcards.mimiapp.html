<script type="application/json" id="mimi-app">{"mimiwork_app": 1, "title": "Flashcard drill", "icon": "🃏", "category": "Teaching", "description": "Paste notes or a reading; Mimi turns them into question cards you flip through. Your deck is kept.", "intro": "Paste the notes, press Make cards, then click a card to flip it.", "suggestions": ["Ten cards from these lecture notes", "Harder questions, no definitions", "Start the drill again"]}</script>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flashcard drill</title>
<style>
  :root { --accent: #0d9488; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --paper: #f9fafb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 780px; margin: 0 auto; padding: 24px 20px 40px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
  textarea, input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); font-weight: 500; padding: 8px 6px; }
  .out { white-space: pre-wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); min-height: 60px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--paper); min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 16px; cursor: pointer; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #e6f4f2; color: var(--accent); font-size: 12px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Flashcard drill</h1>
  <p class="lead">Paste the notes, press Make cards, then click a card to flip it.</p>
  <textarea id="src" placeholder="Paste notes, a chapter summary, a reading…"></textarea>
  <div class="row"><label>Cards <select id="n"><option>6</option><option selected>10</option><option>15</option></select></label>
    <button id="go">Make cards</button><span id="status" class="muted"></span></div>
  <div id="drill" hidden>
    <div class="row"><span id="pos" class="pill"></span><span class="muted">click the card to flip</span></div>
    <div id="card" class="card"></div>
    <div class="row"><button id="prev" class="ghost">Previous</button><button id="next">Next</button><button id="reset" class="ghost">New deck</button></div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function setStatus(t) { $("status").textContent = t || ""; }
  function copyText(t) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); setStatus("Copied."); } catch {} ta.remove(); }
  async function run(btn, fn) { btn.disabled = true; setStatus("Asking Mimi…"); try { await fn(); setStatus(""); } catch (e) { setStatus("Could not do that: " + (e.message || e)); } finally { btn.disabled = false; } }

  let deck = [], i = 0, flipped = false, hard = false;
  Mimi.state.get().then((s) => { if (Array.isArray(s.deck) && s.deck.length) { deck = s.deck; showDrill(); } }).catch(() => {});
  function showDrill() { $("drill").hidden = false; i = 0; flipped = false; render(); }
  function render() { const c = deck[i]; $("pos").textContent = (i + 1) + " / " + deck.length; $("card").textContent = flipped ? c.a : c.q; $("card").style.background = flipped ? "#e6f4f2" : ""; }
  $("card").onclick = () => { flipped = !flipped; render(); };
  $("next").onclick = () => { i = (i + 1) % deck.length; flipped = false; render(); };
  $("prev").onclick = () => { i = (i - 1 + deck.length) % deck.length; flipped = false; render(); };
  $("reset").onclick = () => { $("drill").hidden = true; deck = []; Mimi.state.set({ deck: [] }).catch(() => {}); };
  $("go").onclick = () => run($("go"), async () => {
    const src = $("src").value.trim(); if (!src) return;
    const cards = await Mimi.ask("Write " + $("n").value + " flashcards from the material below" + (hard ? ", favouring application and comparison questions over definitions" : "") + ". Reply with JSON only: an array of objects with keys q (question) and a (answer, one or two sentences).\n\n" + src, { json: true });
    deck = (Array.isArray(cards) ? cards : []).filter((c) => c && c.q && c.a); if (!deck.length) throw new Error("no cards came back");
    Mimi.state.set({ deck }).catch(() => {}); showDrill();
  });
  Mimi.onSuggestion((text) => { hard = /harder|application|no definitions/i.test(text); if (/again|restart/i.test(text)) { i = 0; flipped = false; if (deck.length) render(); } else { if (/ten/i.test(text)) $("n").value = "10"; $("src").focus(); } });
</script>
</body>
</html>
