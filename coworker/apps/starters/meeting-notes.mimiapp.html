<script type="application/json" id="mimi-app">{"mimiwork_app": 1, "title": "Meeting-notes summariser", "icon": "📝", "category": "Meetings", "description": "Paste raw notes or a transcript; get decisions, action items with owners, and open questions you can paste into an email.", "intro": "Paste the notes, press Summarise, copy what you need.", "suggestions": ["Just the action items", "Write it as an email to the team", "What did we decide about the budget?"]}</script>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meeting-notes summariser</title>
<style>
  :root { --accent: #0d9488; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --paper: #f9fafb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 780px; margin: 0 auto; padding: 24px 20px 40px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
  textarea, input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); font-weight: 500; padding: 8px 6px; }
  .out { white-space: pre-wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); min-height: 60px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--paper); min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 16px; cursor: pointer; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #e6f4f2; color: var(--accent); font-size: 12px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Meeting-notes summariser</h1>
  <p class="lead">Paste the notes, press Summarise, copy what you need.</p>
  <textarea id="src" placeholder="Paste meeting notes or a transcript…"></textarea>
  <div class="row"><button id="go">Summarise</button><button id="copy" class="ghost" hidden>Copy</button><span id="status" class="muted"></span></div>
  <div id="out" class="out muted">Decisions, actions and open questions appear here.</div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function setStatus(t) { $("status").textContent = t || ""; }
  function copyText(t) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); setStatus("Copied."); } catch {} ta.remove(); }
  async function run(btn, fn) { btn.disabled = true; setStatus("Asking Mimi…"); try { await fn(); setStatus(""); } catch (e) { setStatus("Could not do that: " + (e.message || e)); } finally { btn.disabled = false; } }

  let ask = "";
  $("go").onclick = () => run($("go"), async () => {
    const src = $("src").value.trim(); if (!src) return;
    const out = await Mimi.ask((ask || "Summarise these meeting notes under three headings: Decisions, Action items (one per line: what — who — by when, or 'no date'), Open questions. Plain text, no preamble.") + "\n\nNotes:\n" + src);
    $("out").textContent = out.trim(); $("out").classList.remove("muted"); $("copy").hidden = false; ask = "";
  });
  $("copy").onclick = () => copyText($("out").textContent);
  Mimi.onSuggestion((text) => { if (/action items/i.test(text)) ask = "List only the action items from these notes, one per line: what — who — by when."; else if (/email/i.test(text)) ask = "Write a short email to the team summarising these notes: what was decided, who does what by when, what is still open. Plain text."; else ask = "From these notes, answer: " + text + ". Quote the relevant line."; if ($("src").value.trim()) $("go").click(); else $("src").focus(); });
</script>
</body>
</html>
