<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>MimiWork</title>
    <!-- Resolve the theme before first paint (no white flash for dark users).
         Must match src/theme.ts: key "openwork-theme", absent/invalid = auto = follow macOS. -->
    <script>
      try {
        var t = localStorage.getItem("openwork-theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // Font and background tint, same keys as src/theme.ts (text size needs the webview API).
        document.documentElement.dataset.font = localStorage.getItem("openwork-font") || "default";
        document.documentElement.dataset.bg = localStorage.getItem("openwork-background") || "plain";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
